[project]
name = "vehicle-routing-demo"
version = "0.1.0"
description = "Static capacitated vehicle-routing and dispatch demonstration"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27,<1",
    "ortools>=9.10,<10",
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "pydeck>=0.9,<1",
    "pyyaml>=6,<7",
    "streamlit>=1.37,<2",
]

[dependency-groups]
test = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
]
lint = [
    "ruff>=0.9,<1",
]
typecheck = [
    "mypy>=1.14,<2",
    "pandas-stubs>=2.2,<3",
    "types-pyyaml>=6,<7",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typecheck" },
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vrp_demo"
module-root = "src"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["vrp_demo"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["vrp_demo"]

[[tool.mypy.overrides]]
module = ["ortools.*", "pydeck.*"]
ignore_missing_imports = true
